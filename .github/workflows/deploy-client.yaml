name: Deploy client to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yaml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-client-production

env:
  PROJECT_ID: rt-pweb-prod
  REGION: us-central1
  SERVICE: personal-website
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/rt-pweb-prod/pweb-images/personal-website:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend image
        run: docker build --platform linux/amd64 --tag "$IMAGE" client

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deploy@rt-pweb-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Push image to Artifact Registry
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet
          docker push "$IMAGE"

      - name: Save current Cloud Run traffic
        id: previous
        run: |
          service=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)
          traffic=$(jq -er '
            [.status.traffic[] | select(.percent > 0)]
            | group_by(.revisionName)
            | map(.[0].revisionName + "=" + (map(.percent) | add | tostring))
            | join(",") | select(length > 0)
          ' <<< "$service")
          echo "traffic=$traffic" >> "$GITHUB_OUTPUT"
          url=$(jq -er '.status.url' <<< "$service")
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run revision
        shell: bash
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --no-traffic \
            --tag smoke \
            --port 8080 \
            --service-account "website-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --quiet 2>&1 | sed -E 's|https://[[:alnum:].-]+\.run\.app|[Cloud Run URL hidden]|g'

      - name: Route traffic to the new revision
        id: promote
        shell: bash
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --to-latest --quiet 2>&1 | sed -E 's|https://[[:alnum:].-]+\.run\.app|[Cloud Run URL hidden]|g'

      - name: Smoke test deployed revision
        id: smoke
        env:
          SERVICE_URL: ${{ steps.previous.outputs.url }}
        run: |
          service=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json)
          revision_url=$(jq -er '
            .status.latestReadyRevisionName as $revision
            | .status.traffic[]
            | select(.tag == "smoke" and .revisionName == $revision)
            | .url | strings | select(length > 0)
          ' <<< "$service")
          echo "::add-mask::$revision_url"
          for url in "$revision_url" "$SERVICE_URL"; do
            body=$(curl --fail --silent --show-error --max-time 10 \
              --retry 2 --retry-delay 2 "$url/")
            if ! [[ "$body" == *'<div id="root"></div>'* ]]; then
              echo "::error::Unexpected smoke test response for /"
              exit 1
            fi
          done

      - name: Restore previous Cloud Run traffic
        if: failure() && (steps.promote.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          PREVIOUS_TRAFFIC: ${{ steps.previous.outputs.traffic }}
        shell: bash
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$PREVIOUS_TRAFFIC" --quiet 2>&1 | sed -E 's|https://[[:alnum:].-]+\.run\.app|[Cloud Run URL hidden]|g'

      - name: Create version
        id: create-version
        run: echo "tag=client-v${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.create-version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Deployed container image: \`$IMAGE\`" \
            --latest=false

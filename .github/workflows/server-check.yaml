name: Server Sanity Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q server

      - name: Check Flask response
        run: |
          python - <<'PY'
          from server.main import app

          response = app.test_client().get("/api/health")
          if response.status_code != 200:
              raise SystemExit(f"Expected HTTP 200 from /api/health, got {response.status}")
          if response.get_json() != {"status": "ok"}:
              raise SystemExit("Unexpected API health response")
          PY
